
      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found in repository root"
            ls -la
            exit 1
          fi
          echo "Using archive: $ZIP"
          unzip -qo "$ZIP" -d .
          test -f nexus_ai_graphics/app/build.gradle
