
name: Build NEXUS AI GRAPHICS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP=$(find . -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir -p nexus_extract
          unzip -qo "$ZIP" -d nexus_extract
          PROJECT=$(find "$PWD/nexus_extract" -type f -path '*/app/build.gradle' | head -n 1)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$(dirname "$PROJECT")")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace
          find "$PROJECT_DIR" -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-GRAPHICS-v0.3
          path: nexus_extract/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
